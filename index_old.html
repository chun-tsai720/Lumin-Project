<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMIN | 數位策展空間</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;800&family=Noto+Sans+TC:wght@200;300;400;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        lumin: {
                            black: '#030303',
                            dark: '#0a0a0a',
                            gold: '#D4AF37',
                            goldlight: '#F5D061',
                            golddark: '#997A15',
                            gray: '#888888',
                            surface: 'rgba(20, 20, 20, 0.6)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans TC', 'sans-serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body, html {
            background-color: #030303;
            color: #ffffff;
            overflow-x: hidden;
            scroll-behavior: smooth;
            margin: 0;
            padding: 0;
        }

        /* 隱藏捲軸 */
        ::-webkit-scrollbar { width: 0px; background: transparent; }

        /* 金色漸層文字 */
        .gold-text-gradient {
            background: linear-gradient(135deg, #F5D061 0%, #D4AF37 50%, #997A15 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            color: transparent;
        }

        /* Premium Button */
        .btn-lumin {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #D4AF37;
            padding: 16px 48px;
            font-size: 0.85rem;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            text-transform: uppercase;
            letter-spacing: 0.3em;
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
        }
        .btn-lumin::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: all 0.6s ease;
        }
        .btn-lumin:hover::before {
            left: 100%;
        }
        .btn-lumin:hover {
            background: rgba(212, 175, 55, 0.15);
            border-color: #F5D061;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
            color: #F5D061;
            transform: translateY(-2px);
        }

        /* Glass Panel */
        .glass-panel {
            background: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(212, 175, 55, 0.15);
            border-bottom: 1px solid rgba(212, 175, 55, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: all 0.5s ease;
        }
        .glass-panel:hover {
            border-top-color: rgba(212, 175, 55, 0.4);
            box-shadow: 0 30px 60px -10px rgba(0, 0, 0, 0.8), 0 0 40px rgba(212, 175, 55, 0.1);
        }

        /* 工具預留區塊 (Spline/Framer/Figma) */
        .design-placeholder {
            position: relative;
            background: rgba(0, 0, 0, 0.5);
            border: 1px dashed rgba(212, 175, 55, 0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: rgba(212, 175, 55, 0.7);
            font-size: 0.8rem;
            letter-spacing: 0.15em;
            text-align: center;
            padding: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .design-placeholder::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(45deg, transparent 48%, rgba(212, 175, 55, 0.05) 50%, transparent 52%);
            background-size: 200% 200%;
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .design-placeholder:hover {
            border-color: rgba(212, 175, 55, 0.8);
            color: rgba(212, 175, 55, 1);
            background: rgba(212, 175, 55, 0.05);
        }

        .badge-spline { background: rgba(255, 87, 137, 0.1); color: #ff5789; border-color: rgba(255, 87, 137, 0.3); }
        .badge-framer { background: rgba(0, 170, 255, 0.1); color: #00aaff; border-color: rgba(0, 170, 255, 0.3); }
        .badge-figma { background: rgba(242, 78, 30, 0.1); color: #f24e1e; border-color: rgba(242, 78, 30, 0.3); }

        /* 背景動態光暈 */
        .ambient-light {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.08) 0%, transparent 60%);
            z-index: -1;
            pointer-events: none;
            filter: blur(60px);
        }

        /* 網格背景 */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            pointer-events: none;
            mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black 30%, transparent 80%);
        }

        /* 主視覺背景圖 (如果有) */
        .main-visual-bg {
            position: fixed;
            inset: 0;
            background-image: url('main_visual.png');
            background-size: cover;
            background-position: center;
            opacity: 0.15;
            z-index: -3;
            mix-blend-mode: screen;
        }

        /* 進場動畫 */
        .animate-fade-up {
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .delay-100 { animation-delay: 0.1s; }
        .delay-200 { animation-delay: 0.2s; }
        .delay-300 { animation-delay: 0.3s; }
        .delay-400 { animation-delay: 0.4s; }

    </style>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- 全域背景層 -->
    <div class="main-visual-bg"></div>
    <div class="bg-grid"></div>
    <div class="ambient-light animate-pulse-slow"></div>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const Button = ({ onClick, children, className = "" }) => (
            <button className={`btn-lumin ${className}`} onClick={onClick}>
                {children}
            </button>
        );

        const Badge = ({ type }) => {
            const styles = {
                spline: "badge-spline",
                framer: "badge-framer",
                figma: "badge-figma",
            };
            const labels = {
                spline: "Spline 3D",
                framer: "Framer UX",
                figma: "Figma UI",
            };
            return (
                <span className={`text-[10px] px-2 py-1 rounded border mb-2 uppercase tracking-widest ${styles[type] || ''}`}>
                    {labels[type] || type}
                </span>
            );
        };

        // 1. 首頁 (Home)
        const Home = ({ navigate }) => (
            <div className="min-h-screen flex flex-col items-center justify-center p-8 relative">
                <div className="z-10 flex flex-col items-center w-full max-w-4xl">
                    
                    {/* Logo 與 3D 預留區 */}
                    <div className="w-64 h-64 md:w-80 md:h-80 mb-12 relative animate-fade-up animate-float">
                        {/* 實體 Logo 圖片 */}
                        <img src="logo.png" alt="Lumin Logo" className="w-full h-full object-contain drop-shadow-[0_0_30px_rgba(212,175,55,0.4)] absolute inset-0 z-10" onError={(e) => { e.target.style.opacity='0'; }}/>
                        
                        {/* Spline 3D 預留區 */}
                        <div className="absolute inset-0 design-placeholder rounded-full z-0 opacity-60">
                            <Badge type="spline" />
                            <span>主視覺 3D Logo<br/>互動元件預留</span>
                        </div>
                    </div>
                    
                    <div className="text-center animate-fade-up delay-100">
                        <h1 className="text-6xl md:text-8xl font-light tracking-[0.4em] gold-text-gradient mb-6 ml-4">LUMIN</h1>
                        <div className="flex items-center justify-center gap-4 mb-16">
                            <div className="h-px w-12 bg-lumin-gold opacity-50"></div>
                            <p className="text-lumin-gray tracking-[0.4em] text-sm uppercase">Digital Exhibition Space</p>
                            <div className="h-px w-12 bg-lumin-gold opacity-50"></div>
                        </div>
                    </div>
                    
                    {/* Framer UI 動畫預留區 */}
                    <div className="w-full max-w-md h-16 design-placeholder rounded-lg mb-12 animate-fade-up delay-200">
                        <Badge type="framer" />
                        <span>進入空間之微動畫過場 UI</span>
                    </div>

                    <div className="animate-fade-up delay-300">
                        <Button onClick={() => navigate('about')}>Enter Space</Button>
                    </div>
                </div>
            </div>
        );

        // 2. 作者介紹 (About)
        const About = ({ navigate }) => (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 md:p-12 relative">
                
                {/* 裝飾文字 */}
                <div className="absolute left-10 top-1/2 -translate-y-1/2 -rotate-90 origin-left text-lumin-gray opacity-20 tracking-[0.5em] text-sm hidden lg:block">
                    AUTHOR INTRODUCTION
                </div>

                <div className="w-full max-w-6xl glass-panel rounded-3xl p-8 md:p-16 flex flex-col lg:flex-row gap-16 items-center animate-fade-up">
                    
                    <div className="w-full lg:w-5/12">
                        {/* 作者 3D 虛擬形象預留區 */}
                        <div className="aspect-[4/5] design-placeholder rounded-2xl w-full">
                            <Badge type="spline" />
                            <span className="text-lg mb-2">Author Avatar / Concept</span>
                            <span className="text-xs opacity-70">3D 互動形象預留區</span>
                        </div>
                    </div>
                    
                    <div className="w-full lg:w-7/12 flex flex-col items-start">
                        <h2 className="text-4xl md:text-5xl font-light tracking-[0.2em] gold-text-gradient mb-4">作者介紹</h2>
                        <p className="text-lumin-goldlight tracking-widest text-sm mb-10 opacity-70 uppercase">About The Creator</p>
                        
                        <div className="space-y-6 text-gray-300 leading-relaxed font-light text-lg mb-10">
                            <p>
                                歡迎來到 LUMIN 數位策展空間。我們透過數位維度重新定義觀展體驗。
                            </p>
                            <p>
                                以「黑與金」為核心視覺，我們試圖在深邃無垠的虛擬網格中，捕捉實體存在的珍貴光芒。這裡不僅是作品的容器，更是連結「實」與「虛」的橋樑。
                            </p>
                        </div>
                        
                        {/* Figma / Framer 排版預留區 */}
                        <div className="w-full h-24 design-placeholder rounded-xl mb-12 flex-row gap-6">
                            <Badge type="figma" />
                            <Badge type="framer" />
                            <span>經歷與社群連結互動組件</span>
                        </div>
                        
                        <div className="flex flex-wrap gap-6">
                            <Button onClick={() => navigate('home')} className="!bg-transparent !border-lumin-gray !text-lumin-gray hover:!border-white hover:!text-white">Return</Button>
                            <Button onClick={() => navigate('hub')}>Explore The Hub</Button>
                        </div>
                    </div>
                </div>
            </div>
        );

        // 3. 大廳 (Hub)
        const Hub = ({ navigate }) => (
            <div className="min-h-screen flex flex-col items-center justify-center p-6 md:p-12 relative">
                
                <div className="text-center animate-fade-up mb-16">
                    <h2 className="text-5xl font-light tracking-[0.3em] gold-text-gradient mb-4 uppercase">The Hub</h2>
                    <p className="text-lumin-gray tracking-[0.3em] text-sm">空間樞紐</p>
                </div>
                
                <div className="flex flex-col md:flex-row gap-10 w-full max-w-5xl mb-20">
                    {/* 實 (Real) */}
                    <div 
                        className="flex-1 glass-panel rounded-3xl p-12 flex flex-col items-center cursor-pointer group animate-fade-up delay-100"
                        onClick={() => navigate('real')}
                    >
                        <div className="w-32 h-32 mb-10 design-placeholder rounded-full group-hover:scale-105 group-hover:border-lumin-gold transition-all duration-500">
                            <Badge type="spline" />
                            <span>'Real' Portal<br/>3D 實體入口</span>
                        </div>
                        <h3 className="text-4xl font-light tracking-[0.2em] text-white mb-4 transition-colors group-hover:text-lumin-goldlight">實</h3>
                        <p className="text-lumin-gold tracking-[0.2em] text-sm mb-6 uppercase">Photography</p>
                        <div className="h-px w-full bg-gradient-to-r from-transparent via-lumin-gold to-transparent opacity-20 mb-6"></div>
                        <p className="text-lumin-gray text-center font-light leading-relaxed">
                            包含 7 件攝影作品展間<br/>(雲, 星, 雷, 風, 光, 車, 街)
                        </p>
                    </div>

                    {/* 虛 (Virtual) */}
                    <div 
                        className="flex-1 glass-panel rounded-3xl p-12 flex flex-col items-center cursor-pointer group animate-fade-up delay-200"
                        onClick={() => navigate('virtual')}
                    >
                        <div className="w-32 h-32 mb-10 design-placeholder rounded-full group-hover:scale-105 group-hover:border-lumin-gold transition-all duration-500">
                            <Badge type="spline" />
                            <span>'Virtual' Portal<br/>3D 虛擬入口</span>
                        </div>
                        <h3 className="text-4xl font-light tracking-[0.2em] text-white mb-4 transition-colors group-hover:text-lumin-goldlight">虛</h3>
                        <p className="text-lumin-gold tracking-[0.2em] text-sm mb-6 uppercase">AI Generative</p>
                        <div className="h-px w-full bg-gradient-to-r from-transparent via-lumin-gold to-transparent opacity-20 mb-6"></div>
                        <p className="text-lumin-gray text-center font-light leading-relaxed">
                            包含 8 件生成藝術展間<br/>(Angel Of The War 1-8)
                        </p>
                    </div>
                </div>

                {/* Framer 導覽列預留 */}
                <div className="w-full max-w-3xl h-16 design-placeholder rounded-full mb-16 animate-fade-up delay-300">
                    <Badge type="framer" />
                    <span>底部全局互動導覽列 (Navigation Bar)</span>
                </div>

                <div className="animate-fade-up delay-400">
                    <Button onClick={() => navigate('about')} className="!bg-transparent !border-lumin-gray !text-lumin-gray hover:!border-white hover:!text-white">Back to About</Button>
                </div>
            </div>
        );

        // 4. 實 (Real) - 攝影展間
        const RealGallery = ({ navigate }) => {
            const items = [
                { name: '雲', desc: 'Cloud' },
                { name: '星', desc: 'Star' },
                { name: '雷', desc: 'Thunder' },
                { name: '風', desc: 'Wind' },
                { name: '光', desc: 'Light' },
                { name: '車', desc: 'Car' },
                { name: '街', desc: 'Street' }
            ];
            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6 md:px-12 relative">
                    <div className="w-full max-w-7xl mb-16 flex flex-col md:flex-row justify-between items-end animate-fade-up">
                        <div>
                            <h2 className="text-5xl font-light tracking-[0.2em] gold-text-gradient mb-4">實 <span className="text-3xl text-lumin-gray font-extralight ml-2">/ Real</span></h2>
                            <p className="text-lumin-goldlight tracking-[0.3em] text-sm uppercase opacity-80">Photography Gallery</p>
                        </div>
                        <div className="mt-8 md:mt-0">
                            <Button onClick={() => navigate('hub')} className="!px-8 !py-3 text-xs">Return to Hub</Button>
                        </div>
                    </div>

                    {/* Figma / Framer 列表排版預留 */}
                    <div className="w-full max-w-7xl h-20 design-placeholder rounded-xl mb-12 animate-fade-up delay-100 flex-row gap-4">
                        <Badge type="figma" />
                        <Badge type="framer" />
                        <span>分類篩選與動態滾動特效組件區</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 w-full max-w-7xl mb-20">
                        {items.map((item, index) => (
                            <div key={index} className={`glass-panel rounded-2xl p-6 flex flex-col cursor-pointer group animate-fade-up`} style={{ animationDelay: `${(index % 4) * 0.1 + 0.2}s` }}>
                                <div className="w-full aspect-[4/3] mb-6 design-placeholder rounded-xl group-hover:border-lumin-goldlight transition-colors overflow-hidden relative">
                                    <Badge type="spline" />
                                    <span className="z-10">作品 3D 框體<br/>或懸浮特效</span>
                                    {/* 模擬圖片懸停放大 */}
                                    <div className="absolute inset-0 bg-black opacity-0 group-hover:opacity-20 transition-opacity z-0"></div>
                                </div>
                                <div className="flex justify-between items-end">
                                    <div>
                                        <h4 className="text-2xl text-white tracking-[0.2em] font-light mb-1">{item.name}</h4>
                                        <p className="text-lumin-gold text-xs tracking-widest uppercase opacity-70">{item.desc}</p>
                                    </div>
                                    <span className="text-lumin-gray text-xs font-mono">0{index + 1}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        // 5. 虛 (Virtual) - AI 生成展間
        const VirtualGallery = ({ navigate }) => {
            const items = Array.from({length: 8}, (_, i) => ({
                name: `Angel Of The War`,
                edition: `Edition 0${i+1}`
            }));
            
            return (
                <div className="min-h-screen flex flex-col items-center py-20 px-6 md:px-12 relative">
                    <div className="w-full max-w-7xl mb-16 flex flex-col md:flex-row justify-between items-end animate-fade-up">
                        <div>
                            <h2 className="text-5xl font-light tracking-[0.2em] gold-text-gradient mb-4">虛 <span className="text-3xl text-lumin-gray font-extralight ml-2">/ Virtual</span></h2>
                            <p className="text-lumin-goldlight tracking-[0.3em] text-sm uppercase opacity-80">AI Generative Gallery</p>
                        </div>
                        <div className="mt-8 md:mt-0">
                            <Button onClick={() => navigate('hub')} className="!px-8 !py-3 text-xs">Return to Hub</Button>
                        </div>
                    </div>

                    {/* Figma / Framer 輪播預留 */}
                    <div className="w-full max-w-7xl h-24 design-placeholder rounded-xl mb-12 animate-fade-up delay-100 flex-row gap-4">
                        <Badge type="figma" />
                        <Badge type="framer" />
                        <span>3D 輪播 (Carousel) 或無限滾動特效組件區</span>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 w-full max-w-7xl mb-20">
                        {items.map((item, index) => (
                            <div key={index} className={`glass-panel rounded-2xl p-6 flex flex-col cursor-pointer group animate-fade-up`} style={{ animationDelay: `${(index % 4) * 0.1 + 0.2}s` }}>
                                <div className="w-full aspect-square mb-6 design-placeholder rounded-xl group-hover:border-lumin-goldlight transition-colors relative overflow-hidden">
                                    <Badge type="spline" />
                                    <span className="z-10">AI 演算法生成<br/>3D 動態物件預留</span>
                                </div>
                                <div className="flex flex-col items-center text-center">
                                    <h4 className="text-lg text-white tracking-[0.1em] font-light mb-2">{item.name}</h4>
                                    <p className="text-lumin-gold text-xs tracking-widest uppercase opacity-70 font-mono">{item.edition}</p>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [route, setRoute] = useState('home');

            // 路由切換時回到頂部
            useEffect(() => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }, [route]);

            // 初始化 Lucide icon
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            const renderRoute = () => {
                switch (route) {
                    case 'home': return <Home navigate={setRoute} />;
                    case 'about': return <About navigate={setRoute} />;
                    case 'hub': return <Hub navigate={setRoute} />;
                    case 'real': return <RealGallery navigate={setRoute} />;
                    case 'virtual': return <VirtualGallery navigate={setRoute} />;
                    default: return <Home navigate={setRoute} />;
                }
            };

            return (
                <div className="w-full min-h-screen relative z-10">
                    {renderRoute()}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
